<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кофейня «Утро» — учебная копия</title>
  <style>
    :root { --bg: #f7f1e8; --ink: #2b211b; --muted: #6b5a4e; --accent: #8a4b2a; --line: #e2d6c6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    .banner { background: #fff3c4; border: 1px solid #e8d48a; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    h1 { font-size: 28px; margin: 20px 0 4px; }
    .hours { color: var(--muted); margin: 0 0 24px; }
    form { display: grid; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
    label { display: grid; gap: 4px; font-size: 15px; }
    input, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
    button { font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    #status { min-height: 1.5em; font-size: 15px; }
    #status.error { padding: 12px; border: 1px solid #d98b84; border-radius: 8px; background: #fff0ee; color: #74261f; }
    #status.rate-limit { padding: 16px; border: 2px solid #c76b16; border-radius: 10px; background: #fff4e5; color: #713900; font-weight: 600; }
    #cooldown-status { min-height: 1.4em; margin: 0; color: var(--muted); font-size: 14px; }
    button:disabled { opacity: .65; cursor: wait; }
  </style>
</head>
<body>
<main>
  <p class="banner">Учебная копия для недели 10. Не публиковать как сайт настоящего бизнеса.</p>
  <h1>Кофейня «Утро»</h1>
  <p class="hours">Будни 7:30–20:00 · выходные 9:00–20:00 · ул. Учебная, 7</p>

  <h2>Заказ выпечки заранее</h2>
  <form id="zakaz-form">
    <label>Имя
      <input name="name" required autocomplete="name">
    </label>
    <label>Телефон
      <input name="phone" required inputmode="tel" autocomplete="tel">
    </label>
    <label>Что приготовить
      <input name="zakaz" required placeholder="например, 2 круассана">
    </label>
    <label>Комментарий
      <textarea name="kommentariy" rows="2" placeholder="к какому времени"></textarea>
    </label>
    <!-- Ловушка для ботов (неделя 8, день 4): люди это поле не видят и не заполняют -->
    <div class="hp" aria-hidden="true">
      <label>Сайт <input name="website" tabindex="-1" autocomplete="off"></label>
    </div>
    <button type="submit">Отправить</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="cooldown-status" aria-live="polite"></p>
  </form>

</main>

<!-- config.js содержит публичный адрес назначения; секреты сюда не помещать. -->
<script src="config.js"></script>
<script>
  var appConfig = window.APP_CONFIG || { webhookUrl: 'undefined', environment: 'неизвестно', configured: false };
  document.getElementById('environment-status').textContent = 'Окружение сборки: ' + appConfig.environment + ' · WEBHOOK_URL: ' + (appConfig.configured ? 'задана' : 'undefined');

  var cooldownMs = 10000;
  var cooldownKey = 'kofeynya-order-next-allowed-at';
  var cooldownStatus = document.getElementById('cooldown-status');
  var submitButton = document.querySelector('#zakaz-form button[type="submit"]');
  var cooldownTimer;
  var requestInFlight = false;
  var originalSubmitLabel = submitButton.textContent;
  var violationNoticeKey = 'kofeynya-rate-limit-notice-at';

  function logAction(action, extra) {
    if (appConfig.environment !== 'локально') return;
    var event = Object.assign({ action: action, time: new Date().toISOString(), environment: appConfig.environment }, extra || {});
    fetch('/__log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(event), keepalive: true })
      .catch(function () { console.warn('Локальный журнал недоступен.'); });
  }

  function reportRateLimitViolation(source) {
    var now = Date.now();
    var lastNotice = 0;
    try { lastNotice = Number(localStorage.getItem(violationNoticeKey)) || 0; } catch (_) {}
    if (now - lastNotice < cooldownMs) return;
    try { localStorage.setItem(violationNoticeKey, String(now)); } catch (_) {}
    var event = { type: 'rate_limit_violation', source: source, time: new Date(now).toISOString(), environment: appConfig.environment, route: '/webhook/zayavka' };
    fetch(appConfig.rateLimitWebhookUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(event), keepalive: true })
      .catch(function () { console.warn('Не удалось отправить уведомление о rate limit в n8n.'); });
  }

  function savedNextAllowedAt() {
    try { return Number(localStorage.getItem(cooldownKey)) || 0; }
    catch (_) { return 0; }
  }

  function blockRateLimitAttempt(until) {
    startCooldown(until);
    var status = document.getElementById('status');
    status.className = 'rate-limit';
    status.setAttribute('role', 'alert');
    status.textContent = 'Слишком частые заявки: разрешена одна отправка за 10 секунд. Подождите окончания таймера.';
    logAction('rate_limit_blocked', { retryAfterSeconds: Math.ceil((until - Date.now()) / 1000) });
    reportRateLimitViolation('client_cooldown');
  }

  function startCooldown(until) {
    clearInterval(cooldownTimer);
    if (!until || until <= Date.now()) {
      submitButton.disabled = requestInFlight;
      submitButton.textContent = originalSubmitLabel;
      cooldownStatus.textContent = '';
      return;
    }
    function updateCooldown() {
      var seconds = Math.ceil((until - Date.now()) / 1000);
      submitButton.disabled = requestInFlight;
      if (seconds <= 0) {
        clearInterval(cooldownTimer);
        submitButton.textContent = originalSubmitLabel;
        cooldownStatus.textContent = '';
        logAction('cooldown_expired');
        return;
      }
      submitButton.textContent = 'Попытаться через ' + seconds + ' сек.';
      cooldownStatus.textContent = 'Разрешена одна отправка раз в 10 секунд.';
    }
    updateCooldown();
    if (until > Date.now()) cooldownTimer = setInterval(updateCooldown, 250);
  }

  submitButton.addEventListener('click', function (event) {
    var until = savedNextAllowedAt();
    if (Date.now() < until && !requestInFlight) {
      event.preventDefault();
      event.stopPropagation();
      blockRateLimitAttempt(until);
    }
  });

  startCooldown(savedNextAllowedAt());
  logAction('page_loaded');
  window.addEventListener('storage', function (event) {
    if (event.key === cooldownKey) startCooldown(Number(event.newValue) || 0);
  });

  document.getElementById('zakaz-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var status = document.getElementById('status');
    var nextAllowedAt = savedNextAllowedAt();
    if (Date.now() < nextAllowedAt) {
      blockRateLimitAttempt(nextAllowedAt);
      return;
    }
    logAction('form_submit_attempt');

    var data = Object.fromEntries(new FormData(e.target).entries());
    var controller = new AbortController();
    var timedOut = false;
    var timeoutId = setTimeout(function () {
      timedOut = true;
      controller.abort();
    }, 10000);

    var cooldownUntil = Date.now() + cooldownMs;
    try { localStorage.setItem(cooldownKey, String(cooldownUntil)); } catch (_) {}
    requestInFlight = true;
    startCooldown(cooldownUntil);
    logAction('submission_started');
    status.className = '';
    status.textContent = 'Отправляем заявку…';
    try {
      var res = await fetch(appConfig.webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
        signal: controller.signal
      });
      if (res.status === 429) {
        logAction('response_429');
        reportRateLimitViolation('backend_429');
        var retryAfter = res.headers.get('Retry-After');
        status.className = 'rate-limit';
        status.setAttribute('role', 'alert');
        status.textContent = 'Сервис временно ограничил число заявок (429). Не отправляйте заявку повторно вслепую.' +
          (retryAfter ? ' Подождите ' + retryAfter + ' сек. и сначала проверьте, появилась ли заявка.' : ' Сначала проверьте статус заявки; автоматического повтора нет.');
        return;
      }
      if (!res.ok) {
        logAction('response_http_error', { status: res.status });
        throw new Error('HTTP ' + res.status);
      }
      status.className = '';
      status.setAttribute('role', 'status');
      status.textContent = 'Заявка принята.';
      logAction('response_success');
      e.target.reset();
    } catch (err) {
      status.className = 'error';
      status.setAttribute('role', 'alert');
      if (timedOut) {
        logAction('request_timeout');
        status.textContent = 'Не получили ответ за 10 секунд. Это не значит, что n8n не принял заявку. Не отправляйте её повторно, пока не проверите выполнение в n8n.';
      } else {
        logAction('request_error', { errorName: err.name });
        status.textContent = 'Не удалось подтвердить отправку (' + err.message + '). Проверьте выполнение в n8n перед повтором.';
      }
      console.error('Отправка заявки:', err);
    } finally {
      clearTimeout(timeoutId);
      requestInFlight = false;
      startCooldown(savedNextAllowedAt());
    }
  });
</script>
</body>
</html>
